name: Spring Boot CI

# This tells GitHub WHEN to run the tests
on:
  push:
    branches: [ "main", "ui-improvement" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # This spins up a temporary Linux server on GitHub
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Java (Adjust the version if you are using Java 21)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Run all your tests
      - name: Run Tests with Maven
        run: mvn -B clean test